name: Supabase Migrations

on:
  push:
    paths:
      - 'supabase/migrations/**'
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-migrations:
    name: Apply SQL Migrations to Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations to remote database
        if: env.SUPABASE_ACCESS_TOKEN != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "Liaison au projet Supabase cqlbaqkovfykajwryfre..."
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            supabase link --project-ref cqlbaqkovfykajwryfre --password "$SUPABASE_DB_PASSWORD"
            supabase db push --password "$SUPABASE_DB_PASSWORD"
          else
            supabase link --project-ref cqlbaqkovfykajwryfre
            supabase db push
          fi
          echo "Migrations appliquées avec succès sur la base Supabase distante."
