name: CI & Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Tests, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run Unit Tests (44 tests)
        run: bun test

      - name: Lint check
        run: bun run lint

      - name: Build Next.js
        run: bun run build

      - name: Trigger Vercel Deployment (si configuré)
        if: success() && github.ref == 'refs/heads/main' && env.VERCEL_DEPLOY_HOOK != ''
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          echo "Déclenchement du déploiement Vercel via Deploy Hook..."
          curl -s -X POST "$VERCEL_DEPLOY_HOOK"
          echo "Déploiement Vercel ordonné avec succès."
